<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Dynamic Theme Color Meta Tag -->
    <meta id="themeColor" name="theme-color" content="#1d4ed8">
    
    <title>PBL HostOps | Migration</title>
    
    <!-- Favicon & Logo -->
    <link rel="icon" type="image/png" href="pbl-logo.png">
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    animation: { 
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                        'fade-in': 'fadeIn 0.2s ease-out forwards' 
                    },
                    keyframes: { 
                        slideUp: { 'from': { opacity: 0, transform: 'translateY(15px)' }, 'to': { opacity: 1, transform: 'translateY(0)' } },
                        fadeIn: { 'from': { opacity: 0, transform: 'scale(0.95)' }, 'to': { opacity: 1, transform: 'scale(1)' } }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        /* Dynamic Theme Backgrounds */
        .bg-gradient-noida { background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%); }
        .bg-gradient-ddn { background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%); }

        /* Clean & Crisp Glass Effect */
        .glass-skeuo {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        }
        
        /* 3D Glowing Dial */
        .skeuo-track { stroke: rgba(255, 255, 255, 0.15); }
        .skeuo-progress { stroke: #ffffff; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8)); stroke-linecap: round; }

        /* Glass Card for list items */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .glass-card:active { transform: scale(0.98); }

        /* Fly Button Animation */
        .btn-fly { overflow: hidden; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-fly span { transition: all 0.3s ease; }
        .btn-fly svg { transform-origin: center; transition: transform 0.3s ease; margin-right: 8px; }
        .btn-fly:hover svg { animation: fly-1 0.6s ease infinite alternate; transform: translateX(5px) rotate(45deg) scale(1.1); }
        .btn-fly:active { transform: scale(0.95); }
        @keyframes fly-1 { from { transform: translateY(0.1em); } to { transform: translateY(-0.1em); } }

        /* Loader */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .spinner-blue { border: 3px solid rgba(59, 130, 246, 0.2); border-top: 3px solid #3b82f6; width: 30px; height: 30px; }
    </style>
</head>

<body class="text-slate-800 font-sans min-h-screen" x-data="hostOpsTracker()">

    <div class="block relative pb-32">
        
        <!-- 1. Background Colored Gradient Curve (Height reduced for better ratio) -->
        <div class="absolute top-0 left-0 w-full rounded-b-[2.5rem] shadow-lg z-10 transition-all duration-500 overflow-hidden h-[350px]" :class="headerGradient">
            <div class="absolute top-[-40px] left-[-40px] w-64 h-64 bg-white/10 rounded-full blur-[50px]"></div>
            <div class="absolute bottom-10 right-[-20px] w-48 h-48 bg-white/20 rounded-full blur-[40px]"></div>
        </div>

        <!-- 2. Header (Logo, Title & Dropdown) -->
        <header class="relative z-50 pt-8 px-5">
            <div class="flex justify-between items-center mb-4">
                
                <!-- Left: PBL Logo & Title -->
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/90 rounded-2xl flex items-center justify-center shadow-[inset_0_2px_5px_rgba(0,0,0,0.1),_0_5px_15px_rgba(0,0,0,0.1)] border border-white p-1.5 backdrop-blur-md">
                        <img src="pbl-logo.png" alt="PBL" class="w-full h-full object-contain drop-shadow-sm">
                    </div>
                    <div>
                        <h1 class="text-2xl font-black text-white leading-none tracking-tight drop-shadow-md">HostOps</h1>
                        <span class="text-[9px] text-white/80 font-black uppercase tracking-widest mt-1 block">Migration Project</span>
                    </div>
                </div>
                
                <!-- Right: Search Toggle + Location Dropdown -->
                <div class="flex items-center gap-2">
                    <!-- Circular Search Toggle -->
                    <button @click="vibrate(); showSearch = !showSearch; if(!showSearch) search='';" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white border border-white/20 shadow-[inset_1px_1px_0_rgba(255,255,255,0.3),_0_4px_10px_rgba(0,0,0,0.1)] active:scale-95 transition">
                        <i class="fa-solid" :class="showSearch ? 'fa-xmark' : 'fa-magnifying-glass'"></i>
                    </button>

                    <!-- Location Dropdown -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="vibrate(); open = !open" @click.away="open = false" 
                            class="flex items-center gap-2 bg-white/10 text-white text-xs font-bold py-2.5 px-3.5 rounded-xl border border-white/20 shadow-[inset_1px_1px_0_rgba(255,255,255,0.3),_0_4px_10px_rgba(0,0,0,0.1)] backdrop-blur-md active:scale-95 transition">
                            <span x-text="activeLocation" class="drop-shadow-sm">Noida</span>
                            <i class="fa-solid fa-caret-down text-[10px] text-white/80 transition-transform" :class="open ? 'rotate-180' : ''"></i>
                        </button>
                        <div x-show="open" x-cloak class="absolute right-0 top-full mt-2 w-32 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-50 animate-fade-in p-1">
                            <div @click="vibrate(); activeLocation = 'Noida'; open = false; updateThemeColor(); fetchData(false)" class="px-3 py-2.5 hover:bg-blue-50 rounded-xl cursor-pointer text-xs font-bold text-slate-700 flex justify-between items-center transition">Noida <i x-show="activeLocation==='Noida'" class="fa-solid fa-check text-blue-500 text-[10px]"></i></div>
                            <div @click="vibrate(); activeLocation = 'Dehradun'; open = false; updateThemeColor(); fetchData(false)" class="px-3 py-2.5 hover:bg-teal-50 rounded-xl cursor-pointer text-xs font-bold text-slate-700 flex justify-between items-center transition mt-0.5">Dehradun <i x-show="activeLocation==='Dehradun'" class="fa-solid fa-check text-teal-500 text-[10px]"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Hidden Collapsible Search Bar -->
            <div x-show="showSearch" x-collapse x-cloak class="mt-4 animate-slide-up">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/60"></i>
                    <input type="text" x-model="search" placeholder="Search Hostname ID..." class="w-full pl-11 pr-4 py-3.5 bg-black/20 text-white placeholder-white/50 border border-white/20 shadow-[inset_0_2px_8px_rgba(0,0,0,0.2)] rounded-2xl outline-none font-bold text-sm backdrop-blur-md transition-all focus:bg-black/30 focus:border-white/40">
                </div>
            </div>
        </header>

        <!-- 3. MAIN SKEUO-GLASS CARD -->
        <main class="relative z-40 px-5 mt-6 max-w-lg mx-auto">
            <div class="glass-skeuo relative px-6 py-6 rounded-[2rem] flex items-center justify-between mb-5 group hover:-translate-y-1 transition-transform duration-300">
                
                <div class="flex flex-col gap-2 relative z-10">
                    <p class="text-[10px] font-black uppercase tracking-widest text-white/70 drop-shadow-sm">Total Systems</p>
                    <h2 class="text-6xl font-black text-white leading-none tracking-tighter drop-shadow-lg" x-text="filteredHostnames.length">0</h2>
                    
                    <!-- Done & Pend Badges -->
                    <div class="mt-3 flex gap-2">
                        <div class="bg-black/20 border border-white/10 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] backdrop-blur-sm">
                            <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
                            <span class="text-[10px] font-bold text-white tracking-widest"><span x-text="doneCount"></span> Done</span>
                        </div>
                        <div class="bg-black/20 border border-white/10 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] backdrop-blur-sm">
                            <div class="w-2 h-2 rounded-full bg-rose-400 shadow-[0_0_8px_#fb7185]"></div>
                            <span class="text-[10px] font-bold text-white tracking-widest"><span x-text="pendingCount"></span> Pend</span>
                        </div>
                    </div>
                </div>
            
                <!-- 3D Glowing Circular Dial -->
                <div class="relative w-28 h-28 bg-white/10 rounded-full p-2.5 shadow-[inset_0_4px_15px_rgba(0,0,0,0.1),_0_10px_20px_rgba(0,0,0,0.1)] flex items-center justify-center border border-white/20 backdrop-blur-md">
                    <div class="relative w-full h-full">
                        <svg class="w-full h-full transform -rotate-90">
                            <!-- Inactive Track -->
                            <circle cx="50%" cy="50%" r="38" class="skeuo-track" stroke-width="7" fill="transparent" />
                            <!-- Active Glowing Progress -->
                            <circle cx="50%" cy="50%" r="38" class="skeuo-progress transition-all duration-1000 ease-out" stroke-width="7" fill="transparent" :stroke-dasharray="238" :stroke-dashoffset="238 - (238 * percentage) / 100" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span class="text-xl font-black text-white drop-shadow-md" x-text="percentage + '%'">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modern Pill Segmented Control (Filters) -->
            <div class="relative z-40 flex p-1.5 bg-black/15 backdrop-blur-md rounded-2xl border border-white/20 shadow-[inset_0_2px_8px_rgba(0,0,0,0.15)] mb-8 max-w-sm mx-auto">
                <button @click="vibrate(); filterStatus='ALL'" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all duration-300" :class="filterStatus === 'ALL' ? 'bg-white text-slate-900 shadow-md transform scale-100' : 'text-white/70 hover:bg-white/10 hover:text-white'">All</button>
                <button @click="vibrate(); filterStatus='PENDING'" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all duration-300" :class="filterStatus === 'PENDING' ? 'bg-white text-rose-600 shadow-md transform scale-100' : 'text-white/70 hover:bg-white/10 hover:text-white'">Pending</button>
                <button @click="vibrate(); filterStatus='MIGRATED'" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all duration-300" :class="filterStatus === 'MIGRATED' ? 'bg-white text-emerald-600 shadow-md transform scale-100' : 'text-white/70 hover:bg-white/10 hover:text-white'">Migrated</button>
            </div>

            <!-- Loading Spinner -->
            <div x-show="loading" class="w-full flex justify-center py-10"><div class="spinner spinner-blue"></div></div>

            <!-- Hostname List Generator -->
            <div x-show="!loading" class="space-y-3">
                <template x-for="(pc, index) in displayedList" :key="pc.oldName + index">
                    
                    <!-- Highly Conspicuous Card Layout -->
                    <div @click="vibrate(); openModal(pc)" class="glass-card p-4 rounded-2xl cursor-pointer hover:shadow-md border-l-[5px] transition-all animate-slide-up group"
                         :class="pc.status === 'MIGRATED' ? 'border-l-emerald-500 bg-white' : 'border-l-rose-400 bg-white'">
                        
                        <div class="flex items-center gap-3">
                            <!-- Left Status Icon -->
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 shadow-sm transition"
                                 :class="pc.status === 'MIGRATED' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-500 group-hover:scale-110'">
                                <i class="fa-solid" :class="pc.status === 'MIGRATED' ? 'fa-check-double' : 'fa-clock'"></i>
                            </div>

                            <!-- Right: The Name Flow -->
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-1.5">
                                    
                                    <!-- OLD Name Box -->
                                    <div class="bg-slate-100 px-2 py-1.5 rounded-lg border border-slate-200 flex-1 min-w-0">
                                        <span class="text-[8px] text-slate-400 font-bold block leading-none tracking-widest uppercase">Old Name</span>
                                        <span class="font-mono text-[11px] sm:text-xs font-bold text-slate-700 block mt-1 break-all leading-tight" x-text="pc.oldName"></span>
                                    </div>
                                    
                                    <!-- Arrow -->
                                    <i class="fa-solid fa-arrow-right text-slate-300 text-[10px] shrink-0"></i>
                                    
                                    <!-- NEW Name Box -->
                                    <div class="px-2 py-1.5 rounded-lg border flex-1 min-w-0 text-right" 
                                         :class="pc.status === 'MIGRATED' 
                                            ? 'bg-emerald-50 border-emerald-200' 
                                            : (activeLocation === 'Noida' ? 'bg-blue-50 border-blue-200' : 'bg-teal-50 border-teal-200')">
                                        <span class="text-[8px] font-bold block leading-none tracking-widest uppercase" :class="pc.status === 'MIGRATED' ? 'text-emerald-600' : themeText">New Name</span>
                                        <span class="font-mono text-[11px] sm:text-xs font-black block mt-1 break-all leading-tight" :class="pc.status === 'MIGRATED' ? 'text-emerald-700' : themeText" x-text="pc.newName"></span>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- Timestamp for Done records -->
                        <template x-if="pc.status === 'MIGRATED'">
                            <div class="mt-3 border-t border-slate-100 pt-2 flex justify-between items-center text-[10px]">
                                <span class="font-bold text-slate-400">Migrated by <span x-text="pc.updatedBy"></span></span>
                                <span class="font-bold text-emerald-500" x-text="pc.date"></span>
                            </div>
                        </template>
                    </div>

                </template>

                <!-- Empty State -->
                <div x-show="displayedList.length === 0" class="text-center py-10 opacity-60">
                    <i class="fa-solid fa-box-open text-4xl mb-3 text-slate-300"></i>
                    <p class="font-bold text-sm">No systems found.</p>
                </div>
            </div>
        </main>
        
        <!-- Bottom Footer Navigation -->
        <footer class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-lg border-t border-slate-100 px-5 py-4 z-50 flex justify-between items-center shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
            <div>
                <p class="text-[9px] font-bold opacity-60 uppercase tracking-widest" :class="themeText">Operator</p>
                <p class="text-xs font-black text-slate-800" x-text="currentOperator">...</p>
            </div>
            <div class="flex gap-2">
                <button @click="vibrate(); fetchData(true)" class="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 active:scale-95 transition">
                    <i class="fa-solid fa-rotate" :class="{'fa-spin text-blue-500': isSyncing}"></i>
                </button>
                <button @click="vibrate(); sendReport()" class="btn-fly h-11 px-5 rounded-xl text-white font-black text-[10px] tracking-widest shadow-lg transition-all" :class="themeBtn">
                    <svg x-show="!emailSending" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"><path fill="none" d="M0 0h24v24H0z"></path><path fill="currentColor" d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"></path></svg>
                    <span x-show="!emailSending">REPORT</span>
                    <div x-show="emailSending" class="spinner"></div>
                </button>
            </div>
        </footer>
    </div>

    <!-- UPDATE MODAL DRAWER -->
    <div x-show="showModal" class="fixed inset-0 z-[150] flex items-end sm:items-center justify-center" x-cloak>
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" @click="vibrate(); showModal = false" x-transition.opacity></div>
        
        <div class="relative w-full bg-white rounded-t-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]"
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full">
            
            <!-- Modal Header -->
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Execute Migration</p>
                    <h3 class="text-xl font-black text-slate-800 leading-none mt-1">Status Update</h3>
                </div>
                <button @click="vibrate(); showModal = false" class="w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-rose-500 shadow-sm transition-colors flex items-center justify-center active:scale-90">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto">
                <!-- Names visual display -->
                <div class="bg-slate-800 text-white rounded-2xl p-5 mb-6 relative overflow-hidden shadow-lg">
                    <div class="absolute right-0 top-0 w-32 h-32 bg-white/5 rounded-full blur-2xl"></div>
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex-1 min-w-0 pr-2">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Source PC</p>
                            <p class="text-sm sm:text-lg font-mono font-black text-slate-200 break-all leading-tight" x-text="form.oldName"></p>
                        </div>
                        <i class="fa-solid fa-angles-right text-slate-500 text-xl shrink-0 animate-pulse"></i>
                        <div class="flex-1 min-w-0 text-right pl-2">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Target Name</p>
                            <p class="text-sm sm:text-lg font-mono font-black break-all leading-tight" :class="activeLocation==='Noida'?'text-blue-400':'text-teal-400'" x-text="form.newName"></p>
                        </div>
                    </div>
                </div>

                <!-- Input Fields -->
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Update Status</label>
                        <div class="flex gap-3">
                            <button @click="vibrate(); form.status = 'PENDING'" class="flex-1 py-3.5 rounded-xl text-xs font-black uppercase tracking-wide border-2 transition-all" :class="form.status === 'PENDING' ? 'bg-rose-50 border-rose-500 text-rose-600' : 'bg-white border-slate-100 text-slate-400'"><i class="fa-solid fa-clock mr-1"></i> Pending</button>
                            <button @click="vibrate(); form.status = 'MIGRATED'" class="flex-1 py-3.5 rounded-xl text-xs font-black uppercase tracking-wide border-2 transition-all shadow-sm" :class="form.status === 'MIGRATED' ? 'bg-emerald-50 border-emerald-500 text-emerald-600' : 'bg-white border-slate-100 text-slate-400'"><i class="fa-solid fa-check-double mr-1"></i> Migrated</button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Engineer Remarks</label>
                        <input type="text" x-model="form.remarks" placeholder="Any complications?" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700 outline-none focus:border-blue-400 transition">
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Authorization</label>
                        <div class="relative"><i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="password" x-model="form.secret" placeholder="Admin Passkey" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-400 transition placeholder-slate-400">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-slate-100 bg-white">
                <button @click="vibrate(); saveUpdate()" class="w-full py-4 rounded-xl font-black text-sm uppercase tracking-widest text-white shadow-xl transition-all flex justify-center items-center gap-2 active:scale-95" :class="themeBtn">
                    <span x-show="!submitting">Confirm Action</span>
                    <div x-show="submitting" class="spinner"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Smart Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 z-[200] transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-10">
        <span id="toast-icon">✅</span><span id="toast-msg" class="text-xs font-bold">Action Done</span>
    </div>

    <script>
        // Global Vibration Function
        function vibrate() {
            if ("vibrate" in navigator) {
                navigator.vibrate(15);
            }
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbwvXRCT7P5aULfkV63RPacAVaxdBUMiKnxGeYu498fhRUZ7Xd3ph2WxCiUs9wOtXH-4JQ/exec";

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerHTML = isError ? '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>' : '<i class="fa-solid fa-check-circle text-emerald-400"></i>';
            toast.classList.remove('opacity-0', '-translate-y-10');
            setTimeout(() => toast.classList.add('opacity-0', '-translate-y-10'), 3000);
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('hostOpsTracker', () => ({
                activeLocation: 'Noida',
                pcs: [], search: '', filterStatus: 'ALL', showSearch: false,
                loading: false, isSyncing: false, submitting: false, emailSending: false, showModal: false,
                form: { oldName: '', newName: '', status: 'PENDING', remarks: '', secret: '' },

                // Theme Getters
                get headerGradient() { return this.activeLocation === 'Noida' ? 'bg-gradient-noida' : 'bg-gradient-ddn'; },
                get themeText() { return this.activeLocation === 'Noida' ? 'text-blue-600' : 'text-teal-600'; },
                get themeColorHex() { return this.activeLocation === 'Noida' ? '#3b82f6' : '#14b8a6'; },
                get themeBtn() { return this.activeLocation === 'Noida' ? 'bg-blue-600 shadow-blue-500/30' : 'bg-teal-600 shadow-teal-500/30'; },
                get currentOperator() { return this.activeLocation === 'Noida' ? 'Ashok Singh' : 'Deependra Singh'; },
                
                init() { 
                    this.updateThemeColor(); // Set initial theme color for mobile status bar
                    this.fetchData(false); 
                },

                // Dynamic Status Bar Color Updater
                updateThemeColor() {
                    const metaTheme = document.getElementById('themeColor');
                    if (metaTheme) {
                        // #1d4ed8 is Noida Blue, #0d9488 is Dehradun Teal
                        metaTheme.setAttribute("content", this.activeLocation === 'Noida' ? '#1d4ed8' : '#0d9488');
                    }
                },

                async fetchData(forceRefresh) {
                    if(forceRefresh) this.isSyncing = true;
                    if(this.pcs.length === 0) this.loading = true;
                    try {
                        const res = await fetch(API_URL + '?action=getMigrationData');
                        const data = await res.json();
                        if (data.hosts) this.pcs = data.hosts;
                        if (forceRefresh) showToast("Database Synced!");
                    } catch (e) { showToast("Network Error", true); }
                    finally { this.loading = false; this.isSyncing = false; }
                },

                get filteredHostnames() {
                    return this.pcs.filter(p => p.location.toUpperCase() === this.activeLocation.toUpperCase());
                },

                get displayedList() {
                    let list = this.filteredHostnames;
                    if (this.filterStatus !== 'ALL') list = list.filter(p => p.status === this.filterStatus);
                    if (this.search) {
                        const s = this.search.toLowerCase();
                        list = list.filter(p => p.oldName.toLowerCase().includes(s) || p.newName.toLowerCase().includes(s));
                    }
                    return list;
                },

                get doneCount() { return this.filteredHostnames.filter(p => p.status === 'MIGRATED').length; },
                get pendingCount() { return this.filteredHostnames.length - this.doneCount; },
                get percentage() { const total = this.filteredHostnames.length; return total === 0 ? 0 : Math.round((this.doneCount / total) * 100); },

                openModal(pc) {
                    this.form = { oldName: pc.oldName, newName: pc.newName, status: pc.status || 'PENDING', remarks: pc.remarks, secret: '' };
                    this.showModal = true;
                },

                async saveUpdate() {
                    if (this.form.secret !== 'PBL2026') { 
                        showToast("Invalid Authorization Key", true); 
                        if ("vibrate" in navigator) navigator.vibrate([50, 50, 50]); 
                        return; 
                    }
                    this.submitting = true;
                    
                    const payload = {
                        action: 'handleMigration',
                        oldName: this.form.oldName,
                        status: this.form.status,
                        remarks: this.form.remarks,
                        updatedBy: this.currentOperator,
                        secret: this.form.secret
                    };

                    try {
                        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                        const result = await res.json();
                        if (result.status === 'success') {
                            this.showModal = false;
                            showToast("System Migrated! ✅");
                            await this.fetchData(false);
                        } else { showToast(result.message, true); }
                    } catch (e) { showToast("Sync Failed", true); }
                    finally { this.submitting = false; }
                },

                async sendReport() {
                    this.emailSending = true;
                    const total = this.filteredHostnames.length;
                    const payload = { action: 'sendMigrationReport', location: this.activeLocation, operator: this.currentOperator, totalCount: total, doneCount: this.doneCount, pendingCount: total - this.doneCount };
                    try {
                        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                        showToast("Report Sent to Boss! 🚀");
                    } catch(e) { showToast("Failed to dispatch email", true); }
                    finally { this.emailSending = false; }
                }
            }));
        });
    </script>
</body>
</html>
