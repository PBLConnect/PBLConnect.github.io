<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="pbl-config.js"></script>
    <title>IT Dashboard | Secure Zero-Trust Access</title>
    
    <!-- 🚀 Instant Pre-Paint Status Bar Matcher (Syncs Phone Clock Bar with HTML) -->
    <script>
        const appVer = typeof PBL_APP_VERSION !== 'undefined' ? PBL_APP_VERSION : 'v3.0';
        document.title += " " + appVer;

        const isDarkTheme = localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDarkTheme) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="icon" type="image/x-icon" href="Assets/images/pbl-logo.ico">
    
    <!-- PWA & Mobile OS Status Bar Sync Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="meta-theme-color" content="#f1f5f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" id="meta-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="app-icon.png">
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Configuration -->
    <script>
        if (sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'IT_Dashboard.html';
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: { 
                        brand: {
                            DEFAULT: '#3b82f6',
                            glow: '#60a5fa',
                            dark: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth Global Transition */
        * {
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f1f5f9; 
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }
        .dark body { 
            background-color: #020617; 
        }
        
        /* High-Tech Dot Matrix */
        .dot-matrix {
            background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .dot-matrix {
            background-image: radial-gradient(rgba(96, 165, 250, 0.09) 1px, transparent 1px);
        }

        /* Ambient Cyber Aura Spheres */
        .aurora-1 {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            top: -60px;
            left: -60px;
            filter: blur(65px);
            pointer-events: none;
            z-index: 1;
        }
        .aurora-2 {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            filter: blur(75px);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Saturated Dual-Layer Glass HUD Panel */
        .glass-panel {
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(59, 130, 246, 0.22);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* 1. Moving Border-Beam Effect */
        .border-beam::after {
            content: '';
            position: absolute;
            inset: -150%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 75%, #3b82f6 90%, #60a5fa 95%, transparent 100%);
            animation: rotateBeam 7s linear infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0.45;
        }
        .dark .border-beam::after {
            opacity: 0.7;
        }
        @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .panel-inner {
            position: relative;
            z-index: 1;
        }

        /* 2. Dynamic Input Inset Glow */
        .modern-input {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modern-input:focus {
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.35), inset 0 1px 2px rgba(0, 0, 0, 0.05);
            border-color: #3b82f6 !important;
        }

        /* 3. Biometric Sonar Radar Waves */
        .bio-btn {
            position: relative;
        }
        .bio-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 14px;
            border: 2px solid rgba(59, 130, 246, 0.4);
            animation: radarPulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
            pointer-events: none;
            opacity: 0;
        }
        @keyframes radarPulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            70% { transform: scale(1.22); opacity: 0; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        /* 4. Logo Backlight Halo */
        .logo-halo {
            filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.45));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .logo-halo:hover {
            transform: scale(1.05);
        }

        /* 6. Button Radiant Shimmer */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            animation: btnSweep 4.5s ease-in-out infinite;
        }
        @keyframes btnSweep {
            0%, 65% { left: -120%; }
            100% { left: 180%; }
        }

        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 2; 
            pointer-events: none; 
        }

        /* AutoFill Smooth Background */
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Hardware Accelerated Smooth Cursor */
        @media (hover: hover) and (pointer: fine) { 
            body, html { 
                cursor: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24'%3e%3cpath d='M4.5.79v22.42l6.56-6.57h9.29L4.5.79z' fill='%233b82f6' stroke='%23ffffff' stroke-width='1.5' stroke-linejoin='round'/%3e%3c/svg%3e") 2 2, default !important; 
            }
            a, button, input, select, textarea, .cursor-pointer { 
                cursor: pointer !important; 
            }
        }
        .custom-ring { 
            position: fixed; 
            left: 0; 
            top: 0; 
            width: 30px; 
            height: 30px; 
            border: 2px solid rgba(59, 130, 246, 0.5); 
            border-radius: 50%; 
            z-index: 100000; 
            pointer-events: none; 
            transition: transform 0.26s cubic-bezier(0.2, 0, 0, 1); 
            will-change: transform; 
        }
        @media (prefers-reduced-motion: reduce), (max-width: 768px) { 
            .custom-ring { display: none !important; } 
        }
    </style>
</head>

        <!-- Zero-Trust Live Security Badge Footer -->
        <div class="mt-7 text-center pt-5 border-t border-slate-100 dark:border-slate-800/80 flex flex-col items-center gap-1.5">

                <span class="relative flex h-1.5 w-1.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500 shadow-[0_0_6px_#10b981]"></span>
                </span>
                <span class="text-[9.5px] font-mono font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                    AES-256 // Zero-Trust Enforced
                </span>
            </div>

                <span id="login-version"></span> • Role-Based Authentication

    <script>
        // ⏱️ 30-MINUTE SESSION VALIDITY CHECK
        const SESSION_TIMEOUT = 30 * 60 * 1000; 

        // 🫧 HARDWARE ACCELERATED LAGGING CURSOR
        function setupCustomCursor() { 
            if(!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
            if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const ring = document.createElement('div'); 
            ring.classList.add('custom-ring'); 
            document.body.appendChild(ring);

            document.addEventListener('mousemove', (e) => {
                ring.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupCustomCursor();
            
            const vElem = document.getElementById('login-version');
            if (vElem) {
                vElem.innerText = typeof PBL_APP_VERSION !== 'undefined' ? PBL_APP_VERSION : 'v2.6.4';
            }

            const lastActive = localStorage.getItem('it_last_active');
            const userData = localStorage.getItem('it_bio_user_data');
            const now = new Date().getTime();

            // Auto-login if session is fresh
            if (lastActive && userData && (now - Number(lastActive) < SESSION_TIMEOUT)) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userData', userData);
                localStorage.setItem('it_last_active', String(new Date().getTime()));
                window.location.href = 'IT_Dashboard.html';
            }
        });

        // 🚀 Haptic Feedback Engine
        function haptic(type = 'light') {
            if (!window.navigator || !window.navigator.vibrate) return;
            if (type === 'light') navigator.vibrate(15); 
            else if (type === 'success') navigator.vibrate([25, 45, 25]); 
            else if (type === 'error') navigator.vibrate([40, 50, 40, 50]); 
        }

        // --- SALTED BASE64 ENCODING ---
        function encodePassword(password) {
            return btoa('PBL_' + password + '_2026');
        }

        // --- THEME ENGINE ---
        function applyThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon1 = document.getElementById('themeIcon');
            const icon2 = document.getElementById('themeIconMobile');
            
            const iconClass = isDark ? "fa-solid fa-sun text-amber-400 text-sm sm:text-base" : "fa-solid fa-moon text-sm sm:text-base";
            if (icon1) icon1.className = iconClass;
            if (icon2) icon2.className = iconClass;
            
            const metaTheme = document.getElementById('meta-theme-color');
            if (metaTheme) metaTheme.setAttribute("content", isDark ? "#020617" : "#f1f5f9");
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        applyThemeIcons();

        function toggleTheme() {
            haptic('light'); 
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyThemeIcons();
        }

        // --- UI CLOCK LOGIC ---
        function updateClock() {
            const timeEl = document.getElementById('liveTime');
            if (timeEl) {
                timeEl.textContent = new Date().toLocaleTimeString('en-US', { hour12: true, hour:'2-digit', minute:'2-digit', second:'2-digit' });
            }
        }
        setInterval(updateClock, 1000); 
        updateClock();

        function togglePassword() {
            haptic('light');
            const passInput = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') { 
                passInput.type = 'text'; 
                icon.classList.replace('fa-eye', 'fa-eye-slash'); 
                icon.classList.add('text-brand');
            } else { 
                passInput.type = 'password'; 
                icon.classList.replace('fa-eye-slash', 'fa-eye'); 
                icon.classList.remove('text-brand');
            }
        }

        // ==========================================
        // 🧬 BIOMETRIC / WEBAUTHN CONTROLLER
        // ==========================================

        async function triggerBiometric() {
            haptic('light');
            const savedCredId = localStorage.getItem('it_bio_cred_id');
            const savedUserData = localStorage.getItem('it_bio_user_data');
            const error = document.getElementById('errorMsg');

            if (!savedCredId || !savedUserData) {
                haptic('error');
                error.classList.remove('hidden');
                error.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>No Biometric Profile. Use Password first.</span>';
                return;
            }

            try {
                let domain = window.location.hostname || "localhost";
                const challenge = new Uint8Array(32); 
                crypto.getRandomValues(challenge);
                const credIdArray = Uint8Array.from(JSON.parse(savedCredId));

                const publicKey = {
                    challenge: challenge,
                    rpId: domain, 
                    allowCredentials: [{ id: credIdArray, type: "public-key" }],
                    userVerification: "required",
                    timeout: 60000
                };

                await navigator.credentials.get({ publicKey });
                
                haptic('success');
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userData', savedUserData);
                localStorage.setItem('it_last_active', String(new Date().getTime()));
                
                const btn = document.getElementById('bioLoginBtn');
                btn.innerHTML = '<i class="fa-solid fa-fingerprint text-emerald-500 animate-pulse text-xl"></i>';
                btn.classList.add('border-emerald-500', 'bg-emerald-500/10');
                error.classList.add('hidden');

                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    window.location.href = params.get('returnUrl') || 'IT_Dashboard.html';
                }, 500);

            } catch (e) {
                console.error(e);
                haptic('error');
                error.classList.remove('hidden');
                error.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>Biometric Handshake Failed.</span>';
            }
        }

        async function setupBiometric(userDataString) {
            if (!window.PublicKeyCredential) return;
            
            if (localStorage.getItem('it_bio_cred_id')) {
                localStorage.setItem('it_bio_user_data', userDataString);
                return;
            }

            try {
                let domain = window.location.hostname || "localhost";
                const challenge = new Uint8Array(32); 
                crypto.getRandomValues(challenge);
                const userId = new Uint8Array(16); 
                crypto.getRandomValues(userId);

                const publicKey = {
                    challenge: challenge,
                    rp: { name: "IT Dashboard Vault", id: domain },
                    user: { id: userId, name: "admin", displayName: "Admin User" },
                    pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                    timeout: 60000
                };

                const credential = await navigator.credentials.create({ publicKey });
                const rawIdArray = Array.from(new Uint8Array(credential.rawId));
                
                localStorage.setItem('it_bio_cred_id', JSON.stringify(rawIdArray));
                localStorage.setItem('it_bio_user_data', userDataString);
            } catch (e) {
                console.warn("Biometric enrollment skipped.");
            }
        }

        // --- AUTHENTICATION PIPELINE ---

        // --- 8. CURSOR-REACTIVE MAGNETIC PARTICLES FIELD ---
        const canvas = document.getElementById("techCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];
        let animationFrameId;
        const mouse = { x: null, y: null, radius: 90 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener("resize", resize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.45;
                this.vy = (Math.random() - 0.5) * 0.45;
                this.size = Math.random() * 1.8 + 0.8; 
                this.baseX = this.x;
                this.baseY = this.y;
            }
            update() {
                // Interactive gentle cursor repulsion
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        this.x -= forceDirectionX * force * 1.5;
                        this.y -= forceDirectionY * force * 1.5;
                    }
                }

                this.x += this.vx; 
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                const isDark = document.documentElement.classList.contains('dark');
                ctx.fillStyle = isDark ? "rgba(96, 165, 250, 0.75)" : "rgba(37, 99, 235, 0.55)"; 
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const isMobile = window.innerWidth < 768;
            const divisor = isMobile ? 20000 : 13000; 
            const count = Math.floor((canvas.width * canvas.height) / divisor); 
            for (let i = 0; i < count; i++) { particles.push(new Particle()); }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isDark = document.documentElement.classList.contains('dark');
            const lineColor = isDark ? "96, 165, 250" : "37, 99, 235"; 
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); 
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 115) {
                        ctx.beginPath(); 
                        ctx.strokeStyle = `rgba(${lineColor}, ${(1 - distance / 115) * 0.52})`;
                        ctx.lineWidth = 0.8; 
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y); 
                        ctx.stroke();
                    }
                }
            }
            animationFrameId = requestAnimationFrame(animate);
        }
        
        resize(); 
        animate();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) cancelAnimationFrame(animationFrameId);
            else animate();
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
